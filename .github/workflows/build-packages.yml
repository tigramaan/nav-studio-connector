name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, "001-desktop-connector"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: nav-studio-connector-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: nav-studio-connector-ubuntu-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
