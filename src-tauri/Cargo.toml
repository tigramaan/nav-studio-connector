[package]
name = "nav-studio-connector"
version = "0.1.0"
description = "Safe local discovery and trust bootstrap for UMEC Nav Studio"
authors = ["UMEC"]
edition = "2021"
rust-version = "1.77.2"
default-run = "nav-studio-connector"

[lib]
name = "nav_studio_connector_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
hex = "0.4"
mdns-sd = "0.13"
native-tls = "0.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tempfile = "3"
thiserror = "2"
url = "2"
x509-parser = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = "0.30"
pkcs8 = { version = "0.10", features = ["pem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
